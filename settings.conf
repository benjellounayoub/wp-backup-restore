# /etc/wp-backup-restore/settings.conf
# Bash config for WordPress backup/restore

# --- Global paths ---
WEBROOT_BASE="/var/www/html"
SAVE_BASE="/var/www/save"
NGINX_BASE="/etc/nginx/sites-available"
LOG_DIR="/var/log/wp-backup"
WEB_OWNERSHIP="www-data:www-data"   # e.g., "nginx:nginx" on some distros

# --- Retention (days) ---
BACKUP_RETENTION_DAYS=30
LOG_RETENTION_DAYS=30

# --- Project registry (keys shown in menus) ---
# You can use absolute paths in PROJECT_WEB/PROJECT_VHOST; if they start with '/',
# the *_BASE is ignored. Otherwise they will be joined to the *_BASE.
PROJECTS=(
  "domain1.com"
  "domain2.com"
  "domain3.com"
  "domain4.com"
  "domain5.com"
  "domain6.com"
)

# Web folder (relative to WEBROOT_BASE or absolute)
declare -A PROJECT_WEB=(
  [domain1.com]="domain1.com"
  [domain2.com]="domain2.com"
  [domain3.com]="domain3.com"
  [domain4.com]="domain4.com"
  [domain5.com]="domain5.com"
  [domain6.com]="domain6.com"
)

# Nginx vhost filename (relative to NGINX_BASE or absolute)
declare -A PROJECT_VHOST=(
  [domain1.com]="domain1.com"
  [domain2.com]="domain2.com"
  [domain3.com]="domain3.com"
  [domain4.com]="domain4.com"
  [domain5.com]="domain5.com"
  [domain6.com]="domain6.com"
)

# Database name (leave empty to auto-detect from wp-config.php)
declare -A PROJECT_DB=(
  [domain1.com]=""
  [domain2.com]=""
  [domain3.ca]=""
  [domain4.ca]=""
  [domain5.ca]=""
  [domain6.com]=""
)

# Optional: Database user (leave empty to auto-detect from wp-config.php)
declare -A PROJECT_DB_USER=(
  [domain1.com]=""
  [domain2.com]=""
  [domain3.ca]=""
  [domain4.ca]=""
  [domain5.ca]=""
  [domain6.com]=""
)
