# /etc/wp-backup-restore/settings.conf
# Bash config for WordPress backup/restore (multi-engine DB + Nginx/Apache)

# --- Global paths ---
WEBROOT_BASE="/var/www/html"
SAVE_BASE="/var/www/backup"
LOG_DIR="/var/log/wp-backup-restore"
WEB_OWNERSHIP="www-data:www-data"   # e.g., "nginx:nginx" on some distros

# --- Web server selection ---
# Allowed values: nginx | apache
SERVER_TYPE="nginx"

# Where vhost/site conf files live (override if you use non-standard paths)
# If a project value starts with '/', it's used as-is; otherwise it's joined to this base.
SERVER_CONF_BASE_NGINX="/etc/nginx/sites-available"
SERVER_CONF_BASE_APACHE="/etc/apache2/sites-available"

# --- Retention (days) ---
BACKUP_RETENTION_DAYS=30
LOG_RETENTION_DAYS=30

# --- Default DB engine for all projects ---
# Allowed values: mysql | mariadb | postgres
DB_ENGINE="mysql"

# --- Default DB connection fallbacks (used if not auto-detected from wp-config.php or project override) ---
DB_HOST_DEFAULT="localhost"
DB_PORT_DEFAULT=""        # leave empty to use engine default (3306 mysql/mariadb, 5432 postgres)

# --- Project registry (keys shown in menus) ---
PROJECTS=(
  "domain1.com"
  "domain2.com"
  "domain3.com"
  "domain4.com"
  "domain5.com"
  "domain6.com"
)

# Web folder (relative to WEBROOT_BASE or absolute)
declare -A PROJECT_WEB=(
  [domain1.com]="domain1.com"
  [domain2.com]="domain2.com"
  [domain3.com]="domain3.com"
  [domain4.com]="domain4.com"
  [domain5.com]="domain5.com"
  [domain6.com]="domain6.com"
)

# Vhost filename (relative to the server's sites-available or absolute path)
# Nginx examples usually without ".conf"; Apache usually WITH ".conf"
declare -A PROJECT_VHOST=(
  [domain1.com]="domain1.com"
  [domain2.com]="domain2.com"
  [domain3.com]="domain3.com"
  [domain4.com]="domain4.com"
  [domain5.com]="domain5.com"
  [domain6.com]="domain6.com"
)

# ENGINE override per project (optional). Values: mysql | mariadb | postgres
declare -A PROJECT_DB_ENGINE=(
  [domain1.com]=""
  [domain2.com]=""
  [domain3.com]=""
  [domain4.com]=""
  [domain5.com]=""
  [domain6.com]=""
)

# Database name (leave empty to auto-detect from wp-config.php for mysql/mariadb)
declare -A PROJECT_DB=(
  [domain1.com]=""
  [domain2.com]=""
  [domain3.com]=""
  [domain4.com]=""
  [domain5.com]=""
  [domain6.com]=""
)

# Database user (leave empty to auto-detect from wp-config.php for mysql/mariadb)
declare -A PROJECT_DB_USER=(
  [domain1.com]=""
  [domain2.com]=""
  [domain3.com]=""
  [domain4.com]=""
  [domain5.com]=""
  [domain6.com]=""
)

# OPTIONAL host/port overrides per project (useful esp. for postgres)
declare -A PROJECT_DB_HOST=(
  [domain1.com]=""
  [domain2.com]=""
  [domain3.com]=""
  [domain4.com]=""
  [domain5.com]=""
  [domain6.com]=""
)

declare -A PROJECT_DB_PORT=(
  [domain1.com]=""
  [domain2.com]=""
  [domain3.com]=""
  [domain4.com]=""
  [domain5.com]=""
  [domain6.com]=""
)
